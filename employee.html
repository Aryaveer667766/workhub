<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | WorkHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #2563eb; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="text-slate-900 antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 flex-shrink-0 hidden md:flex flex-col">
        <div class="h-20 flex items-center px-6 border-b border-slate-100">
            <i data-lucide="briefcase" class="h-6 w-6 text-blue-600 mr-2"></i>
            <span class="text-xl font-bold tracking-tight">WorkHub</span>
        </div>
        <div class="p-4 flex-1">
            <nav class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-blue-50 text-blue-700 rounded-xl font-medium"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl font-medium transition"><i data-lucide="user" class="w-5 h-5"></i> My Profile</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-100">
            <button id="logoutBtn" class="flex w-full items-center gap-3 px-4 py-3 text-slate-600 hover:bg-red-50 hover:text-red-600 rounded-xl font-medium transition"><i data-lucide="log-out" class="w-5 h-5"></i> Log Out</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto relative" id="mainContent" style="display: none;">
        
        <header class="h-20 bg-white border-b border-slate-200 flex items-center px-8 justify-between sticky top-0 z-10">
            <h1 class="text-xl font-semibold text-slate-800">Overview</h1>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center font-bold text-slate-600" id="userInitial"></div>
                <div class="hidden sm:block">
                    <p class="text-sm font-medium text-slate-900" id="userName">Loading...</p>
                    <p class="text-xs text-slate-500">Employee</p>
                </div>
            </div>
        </header>

        <div class="p-8 max-w-4xl mx-auto">
            
            <!-- Dynamic State Container -->
            <div id="statusContainer" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-8 text-center flex flex-col items-center justify-center min-h-[400px]">
                    <div class="spinner"></div>
                    <p class="mt-4 text-slate-500">Loading your application status...</p>
                </div>
            </div>

        </div>
    </main>

    <script type="module">
        lucide.createIcons();
        import { auth, db, doc, getDoc, collection, query, where, getDocs, addDoc, serverTimestamp, onAuthStateChanged, signOut, onSnapshot } from './firebase.js';

        let currentUser = null;

        // Security / Auth Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || userDoc.data().role !== 'employee') {
                await signOut(auth);
                window.location.href = 'index.html';
                return;
            }
            
            currentUser = user;
            const data = userDoc.data();
            document.getElementById('userName').innerText = data.fullName;
            document.getElementById('userInitial').innerText = data.fullName.charAt(0).toUpperCase();
            document.getElementById('mainContent').style.display = 'block';

            // Real-time listener for payment status
            const q = query(collection(db, "payments"), where("employeeUid", "==", user.uid));
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    renderPaymentRequired();
                } else {
                    const payment = snapshot.docs[0].data();
                    if (payment.status === 'pending') renderPendingVerification(payment);
                    else if (payment.status === 'approved') renderApproved(payment);
                    else if (payment.status === 'rejected') renderPaymentRequired(payment.adminNotes || "Previous submission was rejected. Please verify details and try again.");
                }
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => { signOut(auth); });

        function renderPaymentRequired(errorMsg = null) {
            const container = document.getElementById('statusContainer');
            // Using a demo QR code API for visual realism. (Configurable UPI).
            const upiId = "demo@upi";
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=${upiId}&pn=WorkHub&am=99&cu=INR`;
            
            container.innerHTML = `
                <div class="grid md:grid-cols-2">
                    <div class="p-8 bg-slate-50 border-r border-slate-100 flex flex-col items-center justify-center text-center">
                        <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4"><i data-lucide="qr-code" class="w-8 h-8"></i></div>
                        <h2 class="text-2xl font-bold text-slate-900">Application Fee</h2>
                        <p class="text-slate-500 mt-2 mb-6">Complete your profile activation by paying the <span class="font-bold text-slate-900">₹99</span> application fee.</p>
                        
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                            <img src="${qrUrl}" alt="Payment QR" class="w-40 h-40 mx-auto">
                        </div>
                        <div class="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg font-mono text-sm flex items-center gap-2">
                            ${upiId} <button class="hover:text-blue-600" onclick="navigator.clipboard.writeText('${upiId}')"><i data-lucide="copy" class="w-4 h-4"></i></button>
                        </div>
                        <p class="text-xs text-slate-400 mt-4">*This is a manual verification process.</p>
                    </div>
                    
                    <div class="p-8 flex flex-col justify-center">
                        <h3 class="text-lg font-semibold text-slate-900 mb-4">Submit Payment Details</h3>
                        ${errorMsg ? `<div class="mb-4 p-3 bg-red-50 text-red-600 rounded-lg text-sm border border-red-100">${errorMsg}</div>` : ''}
                        <form id="paymentForm" class="space-y-5">
                            <div>
                                <label class="flex items-start gap-3 p-4 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition">
                                    <input type="checkbox" required class="mt-1 w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
                                    <span class="text-sm text-slate-700">I confirm that I have successfully transferred ₹99 to the provided UPI ID.</span>
                                </label>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">12-Digit UTR / Reference Number</label>
                                <input type="text" id="utrInput" required pattern="[0-9]{10,12}" placeholder="e.g. 123456789012" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-600 outline-none transition font-mono">
                            </div>
                            <button type="submit" id="submitUtrBtn" class="w-full py-3 px-4 bg-blue-600 text-white rounded-xl font-medium hover:bg-blue-700 transition shadow-sm flex justify-center items-center gap-2">
                                Submit for Verification
                            </button>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('paymentForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitUtrBtn');
                btn.disabled = true; btn.innerHTML = '<div class="spinner border-t-white w-5 h-5"></div> Submitting...';
                
                try {
                    await addDoc(collection(db, "payments"), {
                        employeeUid: currentUser.uid,
                        amount: 99, currency: "INR", paymentMethod: "UPI",
                        utr: document.getElementById('utrInput').value,
                        status: 'pending',
                        submittedAt: serverTimestamp()
                    });
                    // UI will auto-update via onSnapshot listener
                } catch(err) {
                    alert("Error submitting payment: " + err.message);
                    btn.disabled = false; btn.innerText = 'Submit for Verification';
                }
            });
        }

        function renderPendingVerification(payment) {
            document.getElementById('statusContainer').innerHTML = `
                <div class="p-12 text-center flex flex-col items-center justify-center">
                    <div class="w-20 h-20 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mb-6 shadow-sm"><i data-lucide="clock" class="w-10 h-10"></i></div>
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">Payment Details Submitted</h2>
                    <p class="text-slate-600 max-w-md mx-auto">Your UTR (<span class="font-mono bg-slate-100 px-1 rounded">${payment.utr}</span>) is currently awaiting manual verification by our administrative team.</p>
                    
                    <div class="mt-8 p-4 bg-blue-50 border border-blue-100 rounded-xl max-w-sm mx-auto flex gap-3 text-left">
                        <i data-lucide="info" class="w-5 h-5 text-blue-600 flex-shrink-0 mt-0.5"></i>
                        <p class="text-sm text-blue-800">Verification usually takes 1-2 hours during business days. We will notify you once approved.</p>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderApproved(payment) {
            document.getElementById('statusContainer').innerHTML = `
                <div class="p-12 text-center flex flex-col items-center justify-center bg-gradient-to-b from-white to-green-50/50">
                    <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-6 shadow-sm ring-4 ring-green-50"><i data-lucide="check-circle" class="w-12 h-12"></i></div>
                    <h2 class="text-3xl font-bold text-slate-900 mb-4">Application Verified!</h2>
                    <p class="text-lg text-slate-600 max-w-lg mx-auto">Your payment and profile have been successfully verified.</p>
                    
                    <div class="mt-8 w-full max-w-md bg-white border border-slate-200 rounded-2xl p-6 shadow-sm text-left relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-green-500"></div>
                        <h4 class="font-bold text-slate-900 mb-2 flex items-center gap-2"><i data-lucide="calendar" class="w-5 h-5 text-slate-400"></i> Next Steps</h4>
                        <p class="text-slate-600 text-sm leading-relaxed">Our back-office team will contact you shortly on your registered phone number to coordinate interview arrangements and connect you with matching employers.</p>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
