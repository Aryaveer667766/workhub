<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Dashboard | WorkHub</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config for Custom Colors (Black & Gold Theme) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        inter: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fffdf5', 100: '#fff8e1', 200: '#ffebb8', 300: '#ffd67a',
                            400: '#ffc142', 500: '#eab308', 600: '#ca8a04', 800: '#1a1a1a',
                            900: '#111111', 950: '#0a0a0a',
                        }
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        glow: {
                            '0%': { filter: 'drop-shadow(0 0 5px rgba(234, 179, 8, 0.3))' },
                            '100%': { filter: 'drop-shadow(0 0 15px rgba(234, 179, 8, 0.7))' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            -webkit-font-smoothing: antialiased;
            background-color: #0a0a0a;
        }
        
        .glass-panel {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .spinner {
            width: 24px; height: 24px;
            border: 3px solid rgba(234,179,8,0.2);
            border-radius: 50%;
            border-top-color: #eab308;
            animation: spin 1s linear infinite;
        }

        .input-dark {
            background: #000; border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; transition: all 0.2s;
        }
        .input-dark:focus {
            border-color: #eab308; box-shadow: 0 0 0 1px #eab308; outline: none;
        }
    </style>
</head>
<body class="text-slate-200 h-screen flex overflow-hidden font-sans">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#111] border-r border-white/5 flex-shrink-0 hidden md:flex flex-col relative z-20">
        <div class="h-20 flex items-center px-6 border-b border-white/5">
            <!-- Exact Logo SVG -->
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 flex-shrink-0 animate-glow">
                    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                        <path d="M55 90 V 35 A 18 18 0 0 1 91 35 V 90" fill="#eab308" stroke="#ffffff" stroke-width="3"/>
                        <path d="M60 90 V 40 A 13 13 0 0 1 86 40 V 90" fill="#facc15"/>
                        <line x1="73" y1="12" x2="73" y2="4" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="56" y1="18" x2="50" y2="12" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="90" y1="18" x2="96" y2="12" stroke="#eab308" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="5" y1="90" x2="95" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="35" cy="52" r="5" fill="#ffffff"/>
                        <path d="M35 57 L 32 75 L 25 90 M 32 75 L 42 90" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M34 62 L 45 72 L 48 72" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M34 62 L 27 70" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        <rect x="46" y="69" width="7" height="5" rx="0.5" fill="#ffffff"/>
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">WorkHub</span>
            </div>
        </div>
        
        <div class="p-4 flex-1">
            <nav class="space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-brand-500/10 text-brand-500 border border-brand-500/20 rounded-xl font-semibold transition-all">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:bg-white/5 hover:text-white rounded-xl font-medium transition-all">
                    <i data-lucide="user" class="w-5 h-5"></i> My Profile
                </a>
            </nav>
        </div>
        
        <div class="p-4 border-t border-white/5">
            <button id="logoutBtn" class="flex w-full items-center gap-3 px-4 py-3 text-slate-400 hover:bg-red-500/10 hover:text-red-400 rounded-xl font-medium transition-all">
                <i data-lucide="log-out" class="w-5 h-5"></i> Secure Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto relative" id="mainContent" style="display: none;">
        
        <!-- Abstract Background Glow -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-brand-500/10 rounded-full mix-blend-screen filter blur-[120px] opacity-30 pointer-events-none"></div>

        <header class="h-20 glass-panel flex items-center px-8 justify-between sticky top-0 z-10 border-x-0 border-t-0">
            <h1 class="text-xl font-bold text-white">Overview</h1>
            <div class="flex items-center gap-4">
                <div class="hidden sm:flex flex-col text-right">
                    <p class="text-sm font-bold text-white" id="userName">Loading...</p>
                    <p class="text-xs text-brand-500 font-semibold tracking-wider uppercase">Professional</p>
                </div>
                <div class="w-10 h-10 rounded-xl bg-[#1a1a1a] border border-white/10 flex items-center justify-center font-bold text-brand-500 shadow-lg shadow-brand-500/10" id="userInitial"></div>
            </div>
        </header>

        <div class="p-4 md:p-8 max-w-5xl mx-auto relative z-10">
            
            <!-- Dynamic State Container -->
            <div id="statusContainer" class="bg-[#111] rounded-3xl shadow-2xl border border-white/10 overflow-hidden animate-slide-up">
                
                <!-- Initial Loading State -->
                <div class="p-12 text-center flex flex-col items-center justify-center min-h-[400px]">
                    <div class="spinner mb-4"></div>
                    <p class="text-slate-400 font-inter text-sm">Securely retrieving your profile status...</p>
                </div>

            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script type="module">
        lucide.createIcons();
        import { auth, db, doc, getDoc, collection, query, where, addDoc, serverTimestamp, onAuthStateChanged, signOut, onSnapshot } from './firebase.js';

        let currentUser = null;

        // Security / Auth Check
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            
            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (!userDoc.exists() || userDoc.data().role !== 'employee') {
                    await signOut(auth);
                    window.location.href = 'index.html';
                    return;
                }
                
                currentUser = user;
                const data = userDoc.data();
                document.getElementById('userName').innerText = data.fullName;
                document.getElementById('userInitial').innerText = data.fullName.charAt(0).toUpperCase();
                document.getElementById('mainContent').style.display = 'block';

                // Real-time listener for payment status
                const q = query(collection(db, "payments"), where("employeeUid", "==", user.uid));
                onSnapshot(q, (snapshot) => {
                    if (snapshot.empty) {
                        renderPaymentRequired();
                    } else {
                        // Sort by submittedAt to get the latest (in case of rejections/resubmissions)
                        const payments = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                        payments.sort((a, b) => b.submittedAt - a.submittedAt);
                        const latestPayment = payments[0];
                        
                        if (latestPayment.status === 'pending') renderPendingVerification(latestPayment);
                        else if (latestPayment.status === 'approved') renderApproved(latestPayment);
                        else if (latestPayment.status === 'rejected') renderPaymentRequired(latestPayment.adminNotes || "Previous submission was rejected. Please verify your UTR and try again.");
                    }
                }, (error) => {
                    console.error("Error listening to status:", error);
                });
            } catch(e) {
                console.error("Authentication check failed", e);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => { 
            signOut(auth).then(() => window.location.href = 'index.html'); 
        });

        function renderPaymentRequired(errorMsg = null) {
            const container = document.getElementById('statusContainer');
            // Mock UPI ID for demo purposes
            const upiId = "demo@upi";
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=upi://pay?pa=${upiId}&pn=WorkHub&am=99&cu=INR&bgcolor=ffffff&color=000000`;
            
            container.innerHTML = `
                <div class="grid md:grid-cols-2 min-h-[500px]">
                    <!-- Left: Instructions & QR -->
                    <div class="p-8 md:p-12 bg-black/40 border-r border-white/5 flex flex-col items-center justify-center text-center">
                        <div class="w-16 h-16 bg-brand-500/10 text-brand-500 border border-brand-500/20 rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_20px_rgba(234,179,8,0.15)]">
                            <i data-lucide="qr-code" class="w-8 h-8"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-white mb-3">Verification Fee</h2>
                        <p class="text-slate-400 font-inter text-sm mb-8 leading-relaxed max-w-xs mx-auto">
                            Complete your profile activation by paying the <span class="font-bold text-white">₹99</span> one-time verification fee.
                        </p>
                        
                        <div class="bg-white p-3 rounded-2xl shadow-xl shadow-brand-500/10 mb-6">
                            <img src="${qrUrl}" alt="Payment QR Code" class="w-48 h-48 mx-auto rounded-xl">
                        </div>
                        
                        <div class="bg-[#1a1a1a] border border-white/10 text-slate-300 px-4 py-3 rounded-xl font-mono text-sm flex items-center justify-between gap-4 w-full max-w-xs">
                            <span class="truncate">${upiId}</span>
                            <button class="text-brand-500 hover:text-brand-400 transition" onclick="navigator.clipboard.writeText('${upiId}'); alert('UPI ID Copied!');" title="Copy UPI ID">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Right: Submission Form -->
                    <div class="p-8 md:p-12 flex flex-col justify-center bg-[#111]">
                        <div class="mb-8">
                            <h3 class="text-2xl font-bold text-white mb-2">Submit Details</h3>
                            <p class="text-slate-400 text-sm font-inter">Enter your payment reference to proceed.</p>
                        </div>
                        
                        ${errorMsg ? `
                        <div class="mb-6 p-4 bg-red-950/30 text-red-400 rounded-xl border border-red-900/50 flex gap-3 text-sm font-inter items-start">
                            <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
                            <span>${errorMsg}</span>
                        </div>` : ''}
                        
                        <form id="paymentForm" class="space-y-6">
                            <div>
                                <label class="flex items-start gap-4 p-5 border border-white/10 rounded-2xl cursor-pointer hover:bg-white/5 transition-colors group">
                                    <div class="relative flex items-start">
                                        <input type="checkbox" required class="peer w-5 h-5 appearance-none border border-slate-500 rounded bg-transparent checked:bg-brand-500 checked:border-brand-500 transition-colors mt-0.5 cursor-pointer">
                                        <i data-lucide="check" class="absolute top-1 left-0.5 w-4 h-4 text-brand-950 opacity-0 peer-checked:opacity-100 pointer-events-none"></i>
                                    </div>
                                    <span class="text-sm text-slate-300 font-inter leading-relaxed group-hover:text-white transition-colors">I confirm that I have successfully transferred <strong class="text-white">₹99</strong> to the provided UPI ID.</span>
                                </label>
                            </div>
                            
                            <div class="space-y-2">
                                <label class="block text-sm font-bold text-slate-300">12-Digit UTR / Reference Number</label>
                                <input type="text" id="utrInput" required pattern="[0-9]{10,12}" placeholder="e.g. 123456789012" class="w-full px-4 py-4 input-dark rounded-xl font-mono text-lg tracking-wider" autocomplete="off">
                                <p class="text-xs text-slate-500 font-inter mt-1"><i data-lucide="info" class="w-3 h-3 inline mr-1 mb-0.5"></i>Found in your payment app's transaction history.</p>
                            </div>
                            
                            <button type="submit" id="submitUtrBtn" class="w-full py-4 bg-brand-500 text-brand-950 rounded-xl font-bold hover:bg-brand-400 transition-all shadow-[0_0_15px_rgba(234,179,8,0.2)] flex justify-center items-center gap-2 mt-4 text-base">
                                Submit for Verification
                            </button>
                        </form>
                    </div>
                </div>
            `;
            lucide.createIcons();

            document.getElementById('paymentForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('submitUtrBtn');
                btn.disabled = true; 
                btn.innerHTML = '<div class="spinner border-t-brand-950 opacity-70 w-5 h-5"></div> <span class="opacity-70">Submitting...</span>';
                
                try {
                    await addDoc(collection(db, "payments"), {
                        employeeUid: currentUser.uid,
                        amount: 99, currency: "INR", paymentMethod: "UPI",
                        utr: document.getElementById('utrInput').value.trim(),
                        status: 'pending',
                        submittedAt: serverTimestamp()
                    });
                    // UI will auto-update via onSnapshot listener
                } catch(err) {
                    alert("Error submitting payment: " + err.message);
                    btn.disabled = false; btn.innerText = 'Submit for Verification';
                }
            });
        }

        function renderPendingVerification(payment) {
            document.getElementById('statusContainer').innerHTML = `
                <div class="p-10 md:p-20 text-center flex flex-col items-center justify-center relative overflow-hidden">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-1 bg-gradient-to-r from-transparent via-brand-500 to-transparent opacity-50"></div>
                    
                    <div class="w-24 h-24 bg-brand-500/10 text-brand-500 border border-brand-500/20 rounded-full flex items-center justify-center mb-8 shadow-[0_0_30px_rgba(234,179,8,0.15)] relative">
                        <div class="absolute inset-0 border-2 border-brand-500/30 rounded-full animate-ping opacity-20"></div>
                        <i data-lucide="clock" class="w-10 h-10"></i>
                    </div>
                    
                    <h2 class="text-3xl font-bold text-white mb-4">Verification in Progress</h2>
                    <p class="text-slate-400 font-inter max-w-md mx-auto leading-relaxed">
                        Your UTR (<span class="font-mono bg-white/10 px-2 py-0.5 rounded text-white tracking-wider border border-white/10">${payment.utr}</span>) is currently being reviewed by our verification team.
                    </p>
                    
                    <div class="mt-10 p-5 bg-[#1a1a1a] border border-white/10 rounded-2xl max-w-md mx-auto flex gap-4 text-left shadow-lg">
                        <i data-lucide="shield" class="w-6 h-6 text-brand-500 flex-shrink-0 mt-0.5"></i>
                        <div>
                            <h4 class="font-bold text-white text-sm mb-1">Secure Process</h4>
                            <p class="text-sm text-slate-400 font-inter">This manual check ensures platform integrity. Approvals typically complete within 1-2 business hours.</p>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function renderApproved(payment) {
            document.getElementById('statusContainer').innerHTML = `
                <div class="p-10 md:p-20 text-center flex flex-col items-center justify-center relative overflow-hidden bg-gradient-to-b from-[#111] to-[#0a150f]">
                    
                    <div class="w-28 h-28 bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 rounded-full flex items-center justify-center mb-8 shadow-[0_0_40px_rgba(16,185,129,0.2)]">
                        <i data-lucide="check-circle-2" class="w-14 h-14"></i>
                    </div>
                    
                    <h2 class="text-4xl font-bold text-white mb-4">Profile Verified!</h2>
                    <p class="text-lg text-emerald-400/80 font-medium max-w-lg mx-auto mb-10">
                        Welcome to WorkHub. Your talent profile is now active and secure in our directory.
                    </p>
                    
                    <div class="w-full max-w-lg bg-[#1a1a1a] border border-white/10 rounded-3xl p-8 shadow-2xl text-left relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,1)]"></div>
                        <h4 class="font-bold text-white text-lg mb-4 flex items-center gap-3">
                            <div class="p-2 bg-white/5 rounded-lg border border-white/5"><i data-lucide="sparkles" class="w-5 h-5 text-brand-500"></i></div>
                            What happens next?
                        </h4>
                        <ul class="space-y-4 text-slate-400 font-inter text-sm leading-relaxed">
                            <li class="flex gap-3">
                                <i data-lucide="building-2" class="w-5 h-5 text-slate-500 flex-shrink-0"></i>
                                <span>Verified employers can now discover your anonymized profile based on your skills and experience.</span>
                            </li>
                            <li class="flex gap-3">
                                <i data-lucide="lock" class="w-5 h-5 text-slate-500 flex-shrink-0"></i>
                                <span>Your contact details remain strictly hidden. They are only shared when an employer requests connection and our team approves it.</span>
                            </li>
                            <li class="flex gap-3">
                                <i data-lucide="phone-call" class="w-5 h-5 text-slate-500 flex-shrink-0"></i>
                                <span>Our placement coordinators will reach out directly to your registered number regarding immediate opportunities.</span>
                            </li>
                        </ul>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }
    </script>
</body>
</html>
