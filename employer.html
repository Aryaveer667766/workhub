<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard | WorkHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap'); body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-slate-900 antialiased h-screen flex overflow-hidden">

    <aside class="w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col">
        <div class="h-20 flex items-center px-6 border-b border-slate-800"><i data-lucide="building-2" class="h-6 w-6 text-indigo-400 mr-2"></i><span class="text-xl font-bold text-white tracking-tight">WorkHub</span></div>
        <div class="p-4 flex-1">
            <nav class="space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-3 bg-indigo-500/10 text-indigo-400 rounded-xl font-medium"><i data-lucide="users" class="w-5 h-5"></i> Talent Directory</a>
                <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 rounded-xl font-medium transition" onclick="toggleView('requests')"><i data-lucide="inbox" class="w-5 h-5"></i> My Requests</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800">
            <button id="logoutBtn" class="flex w-full items-center gap-3 px-4 py-3 hover:bg-red-500/10 hover:text-red-400 rounded-xl font-medium transition"><i data-lucide="log-out" class="w-5 h-5"></i> Log Out</button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto" id="mainContent" style="display: none;">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center px-8 justify-between sticky top-0 z-10">
            <h1 class="text-xl font-semibold text-slate-800" id="pageTitle">Talent Directory</h1>
            <div class="font-medium text-slate-900 bg-slate-100 px-4 py-2 rounded-lg text-sm" id="companyNameLabel">Loading...</div>
        </header>

        <!-- Directory View -->
        <div id="directoryView" class="p-8 max-w-6xl mx-auto">
            <div class="flex gap-4 mb-8">
                <input type="text" id="searchCity" placeholder="Filter by City..." class="px-4 py-2 border border-slate-300 rounded-lg outline-none focus:border-indigo-500 flex-1">
                <select id="searchExp" class="px-4 py-2 border border-slate-300 rounded-lg outline-none bg-white w-48">
                    <option value="">Any Experience</option><option value="Fresher">Fresher</option><option value="1-3 Years">1-3 Years</option><option value="3-5 Years">3-5 Years</option><option value="5+ Years">5+ Years</option>
                </select>
                <button onclick="loadDirectory()" class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700">Filter</button>
            </div>
            
            <div id="employeeGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards injected here -->
            </div>
        </div>

        <!-- Requests View -->
        <div id="requestsView" class="p-8 max-w-5xl mx-auto" style="display: none;">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200 text-slate-600">
                        <tr><th class="p-4">Candidate</th><th class="p-4">Status</th><th class="p-4">Contact Details (If Approved)</th></tr>
                    </thead>
                    <tbody id="requestsTableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module">
        lucide.createIcons();
        import { auth, db, doc, getDoc, collection, getDocs, addDoc, serverTimestamp, onAuthStateChanged, signOut, query, where, onSnapshot } from './firebase.js';

        let currentUser = null;
        let requestedUids = new Set();

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (!userDoc.exists() || userDoc.data().role !== 'employer') {
                await signOut(auth); window.location.href = 'index.html'; return;
            }
            
            currentUser = user;
            const employerDoc = await getDoc(doc(db, "employerProfiles", user.uid));
            document.getElementById('companyNameLabel').innerText = employerDoc.data().companyName;
            document.getElementById('mainContent').style.display = 'block';

            // Listen to employer's requests to disable duplicate buttons
            const q = query(collection(db, "contactRequests"), where("employerUid", "==", user.uid));
            onSnapshot(q, (snap) => {
                requestedUids.clear();
                snap.forEach(doc => requestedUids.add(doc.data().employeeUid));
                loadDirectory(); // Reload directory to update button states
                loadRequests();  // Update requests table
            });
        });

        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

        window.toggleView = (view) => {
            if (view === 'requests') {
                document.getElementById('directoryView').style.display = 'none';
                document.getElementById('requestsView').style.display = 'block';
                document.getElementById('pageTitle').innerText = 'My Contact Requests';
            } else {
                document.getElementById('requestsView').style.display = 'none';
                document.getElementById('directoryView').style.display = 'block';
                document.getElementById('pageTitle').innerText = 'Talent Directory';
            }
        };

        window.loadDirectory = async () => {
            const cityF = document.getElementById('searchCity').value.toLowerCase();
            const expF = document.getElementById('searchExp').value;
            
            const snap = await getDocs(collection(db, "employeeProfiles"));
            const grid = document.getElementById('employeeGrid');
            grid.innerHTML = '';
            
            snap.forEach(docSnap => {
                const data = docSnap.data();
                if(cityF && !data.city.toLowerCase().includes(cityF)) return;
                if(expF && data.experienceLevel !== expF) return;

                const hasRequested = requestedUids.has(docSnap.id);
                const btnHtml = hasRequested 
                    ? `<button disabled class="w-full py-2 mt-4 bg-slate-100 text-slate-500 rounded-lg font-medium cursor-not-allowed">Request Pending/Approved</button>`
                    : `<button onclick="requestContact('${docSnap.id}')" class="w-full py-2 mt-4 bg-indigo-50 text-indigo-700 hover:bg-indigo-600 hover:text-white border border-indigo-100 rounded-lg font-medium transition">Request Contact Details</button>`;

                const skillsHtml = data.skills.map(s => `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-xs font-medium">${s}</span>`).join('');
                
                grid.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-lg text-slate-900">${data.fullName}</h3>
                                <p class="text-sm text-slate-500">${data.qualification}</p>
                            </div>
                            <div class="bg-indigo-50 text-indigo-700 p-2 rounded-lg"><i data-lucide="user" class="w-5 h-5"></i></div>
                        </div>
                        <div class="space-y-2 mb-4 flex-1">
                            <div class="flex items-center text-sm text-slate-600 gap-2"><i data-lucide="map-pin" class="w-4 h-4"></i> ${data.city}</div>
                            <div class="flex items-center text-sm text-slate-600 gap-2"><i data-lucide="briefcase" class="w-4 h-4"></i> ${data.experienceLevel}</div>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-4">${skillsHtml}</div>
                        ${btnHtml}
                    </div>
                `;
            });
            lucide.createIcons();
        };

        window.requestContact = async (employeeUid) => {
            if(!confirm("Submit contact request to Admin for this candidate?")) return;
            try {
                await addDoc(collection(db, "contactRequests"), {
                    employerUid: currentUser.uid, employeeUid: employeeUid,
                    status: 'pending', createdAt: serverTimestamp()
                });
                alert("Request submitted. Awaiting admin approval.");
            } catch(e) { alert(e.message); }
        };

        window.loadRequests = async () => {
            const table = document.getElementById('requestsTableBody');
            table.innerHTML = '';
            const reqsSnap = await getDocs(query(collection(db, "contactRequests"), where("employerUid", "==", currentUser.uid)));
            
            for (let docSnap of reqsSnap.docs) {
                const req = docSnap.data();
                
                // Fetch public profile just for the name
                const empSnap = await getDoc(doc(db, "employeeProfiles", req.employeeUid));
                const empName = empSnap.exists() ? empSnap.data().fullName : 'Unknown';

                let contactHtml = `<span class="text-slate-400 italic">Hidden until approved</span>`;
                let statusBadge = `<span class="px-2 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-semibold">Pending Review</span>`;

                if (req.status === 'approved') {
                    statusBadge = `<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold">Approved</span>`;
                    // Fetch from contactShares
                    const sharesSnap = await getDocs(query(collection(db, "contactShares"), where("employerUid", "==", currentUser.uid), where("employeeUid", "==", req.employeeUid)));
                    if (!sharesSnap.empty) {
                        const shareData = sharesSnap.docs[0].data();
                        contactHtml = `
                            <div class="text-sm text-slate-700">
                                <div><i data-lucide="phone" class="w-3 h-3 inline"></i> ${shareData.phone}</div>
                                <div><i data-lucide="mail" class="w-3 h-3 inline"></i> ${shareData.email}</div>
                            </div>
                        `;
                    }
                } else if (req.status === 'rejected') {
                    statusBadge = `<span class="px-2 py-1 bg-red-100 text-red-700 rounded-full text-xs font-semibold">Rejected</span>`;
                }

                table.innerHTML += `
                    <tr>
                        <td class="p-4 font-medium text-slate-900">${empName}</td>
                        <td class="p-4">${statusBadge}</td>
                        <td class="p-4">${contactHtml}</td>
                    </tr>
                `;
            }
            lucide.createIcons();
        };
    </script>
</body>
</html>
